services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: aga
      POSTGRES_USER: aga
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports: ["5432:5432"]
    volumes: ["aga_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aga -d aga"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [aga_private]

  redis:
    image: redis:8-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    ports: ["6379:6379"]
    volumes: ["aga_redis:/data"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD PING"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [aga_private]

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://aga:${POSTGRES_PASSWORD}@postgres:5432/aga?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    ports: ["3000:3000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    networks: [aga_private]

volumes:
  aga_pg:
  aga_redis:
networks:
  aga_private:
    driver: bridge
